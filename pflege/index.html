<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deine Pflege · Duygu Beauty</title>
<meta name="description" content="Deine persönliche Heimpflege-Empfehlung von Duygu Beauty, Gaggenau.">
<style>
@font-face{font-family:'Bebas Neue';font-weight:400;font-display:swap;src:url(../studio/fonts/bebas-neue-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Josefin Sans';font-weight:300;font-display:swap;src:url(../studio/fonts/josefin-sans-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Josefin Sans';font-weight:400;font-display:swap;src:url(../studio/fonts/josefin-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Josefin Sans';font-weight:600;font-display:swap;src:url(../studio/fonts/josefin-sans-latin-600-normal.woff2) format('woff2')}
:root{--bg:#121211;--bg-2:#1A1918;--bg-3:#232120;--line:rgba(255,255,255,.09);--text:#F2EDEB;--muted:#A8A19E;--pink:#D88FA0;--ease:cubic-bezier(.2,.7,.1,1)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Josefin Sans",system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{padding:40px 0 10px;text-align:center}
header img{width:120px;height:auto}
.eb{font-weight:300;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--pink);margin:0}
h1,h2,h3{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1{font-size:clamp(46px,9vw,78px);margin:16px 0 8px}
.lead{color:#d6cfcc;max-width:560px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:30px 0 10px}
.chip{font:400 14px/1 "Josefin Sans",sans-serif;letter-spacing:.06em;padding:13px 18px 11px;border:1px solid var(--line);background:var(--bg-3);color:var(--text);cursor:pointer;transition:border-color .3s,background .3s}
.chip[aria-pressed="true"]{border-color:var(--pink);background:rgba(216,143,160,.16)}
.card{margin:26px 0 20px;background:var(--bg-2);border:1px solid var(--line);padding:clamp(24px,5vw,46px);animation:in .6s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h2{font-size:clamp(38px,7vw,58px);margin:10px 0 10px}
.card .intro{color:#d6cfcc;margin:0 0 26px}
.block{border-top:1px solid var(--line);padding:20px 0 6px}
.block h3{font-size:26px;color:var(--pink);margin-bottom:12px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;align-items:baseline;margin:0 0 14px}
.step .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;color:var(--muted)}
.step b{font-weight:600}
.step small{grid-column:2/4;color:var(--muted);font-size:15px;line-height:1.45}
.step .p{color:var(--pink);font-weight:600;white-space:nowrap}
.tip{background:var(--bg-3);border-left:2px solid var(--pink);padding:16px 18px;margin:18px 0 0;font-size:16px}
.studio{margin-top:22px;font-size:16px;color:#d6cfcc}
.studio b{color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 "Josefin Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:16px 24px 13px;border:1px solid var(--pink);background:var(--pink);color:var(--bg);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pink)}
.fine{color:var(--muted);font-size:13px;margin:16px 0 0}
.empty{text-align:center;color:var(--muted);margin:40px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 50px}
footer a{color:var(--muted)}
.cust .chips,.cust .studio-only{display:none}
.studio-only{display:block}
@media (max-width:520px){.step{grid-template-columns:24px 1fr}.step .p{grid-column:2}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff;color:#1a1918;font-size:12pt}
  header img{filter:invert(1) brightness(.2)}
  .chips,.actions,.studio-only,footer .nop{display:none!important}
  .card{border:1px solid #ddd;background:#fff;animation:none;margin:10px 0;padding:18px 22px}
  .card .intro,.studio,.lead{color:#333}
  .step small,.fine,.step .n{color:#666}
  .block{border-color:#ddd}
  .tip{background:#f6f0ef}
  .eb,.step .p,.block h3{color:#9E5568}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../studio/img/logo-dark.png" alt="Duygu Beauty" width="1004" height="668">
    <p class="eb" style="margin-top:22px">Deine Pflege für zuhause</p>
    <h1 id="title">Deine Haut-Routine</h1>
    <p class="lead" id="lead">Was im Studio beginnt, setzt du zuhause fort. Wähle den Hauttyp aus deiner Hautanalyse.</p>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Hauttyp wählen"></div>
  <div id="out"><p class="empty">Hauttyp antippen, dann erscheint die passende Routine.</p></div>

  <footer>
    <p>Duygu Beauty · Hauptstraße 22 · 76571 Gaggenau · <a href="https://www.planity.com/de-DE/duygu-beauty-76571-gaggenau" target="_blank" rel="noopener">Termin über Planity</a></p>
    <p class="nop"><a href="../#impressum">Impressum</a> · <a href="../#datenschutz">Datenschutz</a></p>
  </footer>
</div>

<script>
var WA='4917621118978';
var T={
 trocken:{name:'Trocken & durstig',intro:'Deine Haut braucht vor allem Feuchtigkeit und eine Barriere, die sie hält. Sanft reinigen, nichts austrocknen.',
  morgen:[['Lait nettoyant douceur','29,50 €','Milde Reinigungsmilch, mit lauwarmem Wasser abnehmen.'],['Tonique hydratant','24,50 €','Auf ein Pad oder direkt in die Hände, sanft einklopfen.'],['Serum Hydravita','39,50 €','2–3 Tropfen auf die noch leicht feuchte Haut.'],['Crème hyaluronique','49,50 €','Feuchtigkeitscreme für Tag und Nacht.']],
  abend:[['Lait nettoyant douceur','29,50 €','Auch abends, um Make-up und Sonnenschutz zu lösen.'],['Serum Hydravita','39,50 €','Gleich wie morgens.'],['Crème hyaluronique','49,50 €','Ruhig etwas großzügiger auftragen.']],
  extra:'1× pro Woche eine Feuchtigkeitsmaske nach der Reinigung.',studio:'Glass Skin Aquafacial alle 4–6 Wochen.'},
 rot:{name:'Empfindlich & schnell gerötet',intro:'Deine Haut reagiert schnell auf Wärme, Reibung und zu viele Produkte. Weniger ist hier mehr: mild, beruhigend, konsequent.',
  morgen:[['Lait nettoyant douceur','29,50 €','Keine heißen Duschen ins Gesicht, nur lauwarm.'],['Tonique calmant','24,50 €','Beruhigendes Tonic, ohne Reiben einklopfen.'],['Anti Redness Fluid','56,00 €','Leichtes Fluid für ein ruhigeres Hautbild.'],['Crème couperose','39,00 €','Pflegt Haut, die zu sichtbaren Äderchen neigt.']],
  abend:[['Lait nettoyant douceur','29,50 €','Sanft, ohne Bürste oder Peeling-Pads.'],['Tonique calmant','24,50 €','Gleich wie morgens.'],['Anti Redness Cream','65,00 €','Reichhaltigere Pflege für die Nacht.']],
  extra:'Bei gespannter Haut: SOS masque douceur (25,00 €) 10 Minuten auflegen.',studio:'Signature Ritual oder Aquafacial mit beruhigendem Enzympeeling.'},
 unrein:{name:'Unrein & glänzend',intro:'Deine Haut produziert viel Talg und Poren verstopfen schnell. Gründlich reinigen, aber nicht austrocknen, sonst fettet sie noch mehr nach.',
  morgen:[['Gel nettoyant matifiant','26,50 €','Reinigungsgel, kurz einmassieren und abspülen.'],['Tonique matifiant','24,50 €','Klärt und mattiert.'],['Sérum Niacinamide','43,50 €','Für ein feineres Porenbild.'],['24h Fluide Lactique Mat','38,00 €','Leichte, mattierende Feuchtigkeit.']],
  abend:[['Gel nettoyant matifiant','26,50 €','Make-up vorher gründlich entfernen.'],['Sérum Niacinamide','43,50 €','Gleich wie morgens.'],['Crème Clarifiante','27,50 €','Klärende Pflege für die Nacht.']],
  extra:'Einzelne Pickel nicht ausdrücken: Stick Contrôle (12,50 €) gezielt auftupfen.',studio:'Aquafacial mit Säure-Peeling (PurePeel) oder SU SKIN als Kur.'},
 reif:{name:'Reif & erste Linien',intro:'Die Zellerneuerung wird langsamer und die Haut verliert Feuchtigkeit und Spannkraft. Jetzt zählen Wirkstoffe und täglicher Sonnenschutz.',
  morgen:[['Gel nettoyant anti-âge','26,50 €','Milde Reinigung.'],['Tonique anti-âge','24,50 €','Bereitet die Haut auf die Wirkstoffe vor.'],['Refine Serum','56,00 €','Verfeinert das Hautbild.'],['Crème solaire protectrice','42,00 €','Jeden Tag LSF, auch im Winter. Das ist dein bestes Anti-Aging.']],
  abend:[['Gel nettoyant anti-âge','26,50 €','Gleich wie morgens.'],['24h Retinol like Cream','69,00 €','Abends, langsam starten: erst jeden 2. Abend.'],['Retinoid like Eye Cream','65,00 €','Eine kleine Menge um die Augen klopfen.']],
  extra:'Wenn Retinol neu für dich ist: kurzes Kribbeln ist normal, Rötung nicht. Dann eine Pause machen und mir schreiben.',studio:'SU SKIN Bio-Microneedling als 4er-Kur oder Signature Ritual.'},
 fahl:{name:'Fahl & müde',intro:'Abgestorbene Hautschüppchen lassen die Haut grau wirken. Regelmäßig sanft peelen und mit Glow-Wirkstoffen nachlegen.',
  morgen:[['Lait nettoyant douceur','29,50 €','Milde Reinigung.'],['Ginger Glow Drops','60,00 €','2 Tropfen pur oder in die Creme gemischt.'],['Cream of the Year','65,00 €','Pflegt und gibt Frische.'],['Crème solaire protectrice','42,00 €','Schützt den Glow.']],
  abend:[['Lait nettoyant douceur','29,50 €','Gründlich, aber sanft.'],['Glow Essence Ampullen','35,50 €','1 Ampulle, mit den Händen einarbeiten.'],['Cream of the Year','65,00 €','Gleich wie morgens.']],
  extra:'1–2× pro Woche Peeling Enzymatique (29,50 €), nicht öfter.',studio:'Golden Needle Glow oder Aquafacial mit GlowPeel.'},
 needling:{name:'Nach Microneedling & SU SKIN',intro:'Deine Haut arbeitet jetzt bis zu 48 Stunden weiter. In dieser Zeit nur beruhigen, schützen und keine Wirkstoffe.',
  morgen:[['Post Kit ProRenew','25,00 €','Genau nach Anleitung aus dem Studio verwenden.'],['Protecting Sun Fluid','24,00 €','Hoher Sonnenschutz, Sonne meiden.']],
  abend:[['Post Kit ProRenew','25,00 €','Sanft auftragen, nicht reiben.']],
  extra:'48 Stunden: kein Make-up, keine Sauna, kein Sport, keine Säuren oder Retinol. Danach wieder deine normale Routine.',studio:'Nächste Sitzung deiner Kur in 4 Wochen.'}
};
var ORDER=['trocken','rot','unrein','reif','fahl','needling'];
var params=new URLSearchParams(location.search), chosen=params.get('typ');
var cust=!!chosen && params.get('studio')!=='1';
if(cust) document.body.classList.add('cust');
var chips=document.getElementById('chips'), out=document.getElementById('out');
ORDER.forEach(function(k){var b=document.createElement('button');b.className='chip';b.textContent=T[k].name;b.setAttribute('aria-pressed','false');b.onclick=function(){show(k,true)};b.dataset.k=k;chips.appendChild(b);});
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function list(a){return a.map(function(s,i){return '<div class="step"><span class="n">'+(i+1)+'</span><b>'+esc(s[0])+'</b><span class="p">'+esc(s[1])+'</span><small>'+esc(s[2])+'</small></div>'}).join('')}
function show(k,push){
  var t=T[k]; if(!t) return;
  [].forEach.call(chips.children,function(b){b.setAttribute('aria-pressed',b.dataset.k===k?'true':'false')});
  var link=location.origin+location.pathname+'?typ='+k;
  var prods=t.morgen.concat(t.abend).map(function(s){return s[0]}).filter(function(v,i,a){return a.indexOf(v)===i}).join(', ');
  var res='https://wa.me/'+WA+'?text='+encodeURIComponent('Hallo Duygu, ich möchte gern Produkte aus meiner Pflege-Routine ('+t.name+') reservieren: '+prods);
  var share='https://wa.me/?text='+encodeURIComponent('Deine Pflege-Routine für zuhause von Duygu Beauty: '+link);
  out.innerHTML='<article class="card"><p class="eb">Dein Hauttyp</p><h2>'+esc(t.name)+'</h2><p class="intro">'+esc(t.intro)+'</p>'+
   '<div class="block"><h3>Morgens</h3>'+list(t.morgen)+'</div>'+
   '<div class="block"><h3>Abends</h3>'+list(t.abend)+'</div>'+
   '<p class="tip"><b>Extra:</b> '+esc(t.extra)+'</p>'+
   '<p class="studio"><b>Im Studio dazu:</b> '+esc(t.studio)+'</p>'+
   '<div class="actions">'+
     (cust?'<a class="btn" href="'+res+'" target="_blank" rel="noopener">Produkte reservieren</a>':'<a class="btn" href="'+share+'" target="_blank" rel="noopener">Per WhatsApp schicken</a>')+
     '<button class="btn ghost" onclick="window.print()">Drucken</button></div>'+
   '<p class="fine">Alle Produkte erhältlich im Studio. Preise Stand November 2026. Die Empfehlung ersetzt keine ärztliche Beratung.</p></article>';
  document.getElementById('title').textContent=cust?'Deine Haut-Routine':'Pflege-Empfehlung';
  if(cust) document.getElementById('lead').textContent='Deine persönliche Routine aus der Hautanalyse. Speicher dir diese Seite.';
  if(push && !cust) history.replaceState(null,'','?typ='+k+'&studio=1');
}
if(chosen) show(chosen,false);
</script>
</body>
</html>
